<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Kapaszkodni – shotlist (nyomtatható)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans+Condensed:wght@400;600;700&display=swap">
<style>
/* Fekvő A4 shotlist: shotonként egy sor storyboarddal, a szkriptesnek take-körökkel és jegyzethellyel. */
@page{size:A4 landscape;margin:8mm 8mm 10mm}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#000}
body{font-family:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;font-size:8.6pt;line-height:1.25}
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:6mm;border-bottom:2px solid #000;padding-bottom:2mm;margin-bottom:3mm}
.top h1{font-family:"Courier Prime",monospace;font-size:20pt;margin:0;letter-spacing:.03em}
.top .meta{font-family:"Courier Prime",monospace;font-size:9pt;line-height:1.35}
.top .legend{font-size:7.4pt;text-align:right;color:#333}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #000;padding:2.5px 4px;vertical-align:middle}
thead th{background:#c4c4c4;font-size:7.2pt;text-transform:uppercase;letter-spacing:.04em;text-align:center}
thead{display:table-header-group}
tr{break-inside:avoid}
td.ord{width:7mm;text-align:center;font-family:"Courier Prime",monospace;color:#444}
td.no{width:18mm;text-align:center;font-family:"Courier Prime",monospace;font-weight:700;font-size:13pt;line-height:1.1}
td.no small{display:block;font-size:7pt;font-weight:400}
td.sb{width:40mm;padding:1px;text-align:center}
td.sb img{display:block;width:100%;height:27mm;object-fit:contain}
td.sb .none{height:27mm;display:flex;align-items:center;justify-content:center;color:#777;font-size:7pt}
td.desc{width:58mm}
td.desc b{display:block;font-size:9pt}
.com{color:#c00000;font-weight:700;display:block;margin-top:2px}
td.spec{width:34mm;font-size:7.8pt}
td.spec span{display:block}
td.tal{width:16mm;text-align:center}
td.eff{width:13mm;text-align:center;font-size:7.4pt;text-transform:uppercase}
td.eff.uh{font-weight:700;color:#c00000}
td.takes{width:30mm;text-align:center;font-family:"Courier Prime",monospace;font-size:9.5pt;letter-spacing:.15em;line-height:1.7}
td.notes{}
td.ok{width:9mm}
tr.scene td{background:#e2e2e2;font-family:"Courier Prime",monospace;font-weight:700;font-size:9pt;text-align:left;padding:3px 6px}
</style>
</head>
<body>
<div class="top">
  <h1>KAPASZKODNI · shotlist</h1>
  <div class="meta">2026.11.12. csütörtök &nbsp;·&nbsp; Rendező: Ágoston András &nbsp;·&nbsp; DP: Détári Szabolcs &nbsp;·&nbsp; Script: Bence</div>
  <div class="legend">Forgatási sorrend · take-ek: karikázd a jót</div>
</div>
<table>
<thead><tr><th>#</th><th>Sc / Shot</th><th>Storyboard</th><th>Leírás</th><th>Kamera</th><th>Szereplő</th><th>Effort</th><th>Take</th><th>OK</th><th>Szkriptes jegyzet</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<script>
window.render=function({SHOTS,SCENES}){
  let h="",last=0;
  SHOTS.forEach((s,i)=>{
    if(s.sc!==last){const sc=SCENES.find(x=>x.n===s.sc);h+=`<tr class="scene"><td colspan="10">${s.sc}. ${sc.slug}</td></tr>`;last=s.sc}
    const sb=s.sc<3?`<img src="storyboard/${s.id}.jpg" alt="">`:`<div class="none">nincs storyboard</div>`;
    h+=`<tr><td class="ord">${i+1}</td><td class="no">${s.sc}/${s.no}<small>${s.loc} · ${s.dn==="ESTE"?"este":"nappal"}</small></td><td class="sb">${sb}</td>
      <td class="desc"><b>${s.type}</b>${s.desc}${s.com?`<span class="com">${s.com}</span>`:""}</td>
      <td class="spec"><span><b>${s.lens}</b></span><span>${s.angle}</span><span>${s.move} · ${s.sup}</span></td>
      <td class="tal">${s.talent}</td><td class="eff${s.eff==="Ultra High"?" uh":""}">${s.eff}</td>
      <td class="takes">1 2 3 4 5<br>6 7 8 9 10</td><td class="ok"></td><td class="notes"></td></tr>`;
  });
  document.getElementById("rows").innerHTML=h;
};
</script>
</body>
</html>
