<title>Kapaszkodni 1st AD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: telefon-első forgatási vezérlő. Fent óra + állapot + napi sáv, középen a mostani blokk gyűrűs visszaszámlálóval,
   lent állandó akciósáv (Vissza · Kész · +5′) és fülek. Egyetlen sötét téma szándékosan: díszletben, félhomályban használjuk.
   Színlogika: hideg árnyalat = a blokk típusa, meleg árnyalat = baj van (narancs: fogy a tartalék, piros: túllépés). */
:root{
  --bg:#07090d; --panel:#10141b;
  --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.075); --surface-3:rgba(255,255,255,.12);
  --hair:rgba(255,255,255,.09); --hair-2:rgba(255,255,255,.17);
  --fg:#f3f5f8; --fg-2:rgba(236,240,246,.68); --fg-3:rgba(236,240,246,.44);
  --ok:#3fe08f; --warn:#ffb224; --late:#ff5263;
  --shoot:#35d8e8; --move:#8fa3ff; --lunch:#c693ff; --prep:#9aa8bb; --pres:#9aa8bb; --res:#9aa8bb;
  --state:var(--ok); --type:var(--prep);
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-script:"Courier Prime","Courier New",monospace;
  --r-card:20px; --r-tile:14px; color-scheme:dark;
}
[data-type="shoot"]{--type:var(--shoot)} [data-type="move"]{--type:var(--move)} [data-type="lunch"]{--type:var(--lunch)}
[data-type="prep"]{--type:var(--prep)} [data-type="pres"]{--type:var(--pres)} [data-type="res"]{--type:var(--res)}
body[data-state="ok"]{--state:var(--ok)} body[data-state="warn"]{--state:var(--warn)} body[data-state="late"]{--state:var(--late)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.cap{font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.muted{color:var(--fg-2)} .small{font-size:13px}
.ic{flex:none;display:block}
h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0}
p{margin:0}

/* fények */
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aura i{position:absolute;border-radius:50%;filter:blur(80px);transition:background 1s ease}
.aura i:nth-child(1){width:130vmax;height:74vmax;left:50%;top:-50vmax;margin-left:-65vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--state) 60%,transparent),transparent);opacity:.5;animation:breathe 9s ease-in-out infinite}
.aura i:nth-child(2){width:70vmax;height:70vmax;right:-34vmax;bottom:-30vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--type) 45%,transparent),transparent);opacity:.26;animation:float 26s ease-in-out infinite alternate}
.vig{position:fixed;inset:0;z-index:0;pointer-events:none;box-shadow:inset 0 0 140px 20px color-mix(in srgb,var(--late) 60%,transparent);opacity:0;transition:opacity .4s}
body.over .vig{opacity:1;animation:alarm 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.34;transform:scale(1.05)}}
@keyframes float{to{transform:translate(-8vw,-6vh) scale(1.08)}}
@keyframes alarm{50%{opacity:.3}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes blink{50%{opacity:.25}}

.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 190px}

/* fejléc */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 -16px;padding:10px 16px 10px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--hair)}
.hdr-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.clock{display:flex;align-items:baseline;gap:1px;font-weight:700;font-size:26px;letter-spacing:-.03em;line-height:1}
.clock span{font-size:15px;color:var(--fg-3);font-weight:600;letter-spacing:0}
.simchip{margin-left:8px;align-self:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-decoration:none;color:var(--move);border:1px solid color-mix(in srgb,var(--move) 50%,transparent);border-radius:999px;padding:3px 7px;white-space:nowrap}
.pill{justify-self:center;display:inline-flex;align-items:center;gap:7px;max-width:100%;height:28px;padding:0 12px 0 10px;border-radius:999px;font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--state);background:color-mix(in srgb,var(--state) 13%,transparent);border:1px solid color-mix(in srgb,var(--state) 32%,transparent)}
.pill i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--state);box-shadow:0 0 10px var(--state)}
.pill.idle{color:var(--fg-2);background:var(--surface-2);border-color:var(--hair)} .pill.idle i{background:var(--fg-3);box-shadow:none}
.wrapbox{text-align:right;line-height:1.05}
.wrapbox b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--state)}
.strip{position:relative;display:flex;align-items:center;gap:2px;height:18px;margin-top:9px;text-decoration:none}
.strip span{flex-basis:0;min-width:2px;height:6px;border-radius:3px;background:var(--type);opacity:.24}
.strip span.done{opacity:.6} .strip span.cur{opacity:1;height:10px;box-shadow:0 0 12px color-mix(in srgb,var(--type) 80%,transparent)}
.strip span.skip{opacity:.07}
.strip .nowmark{position:absolute;left:var(--now,0%);top:0;bottom:0;width:2px;margin-left:-1px;border-radius:1px;background:var(--fg);box-shadow:0 0 8px #fff}
.hdr-meta{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-size:12px;color:var(--fg-2);font-weight:550}
.hdr-meta b{color:var(--fg);font-weight:700}
@media (max-width:380px){.clock{font-size:23px}.pill{font-size:11.5px;padding:0 9px 0 8px}}

/* alap elemek */
main{padding-top:14px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:14px;min-width:0}
.card{background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.032));border:1px solid var(--hair);border-radius:var(--r-card);padding:18px;min-width:0;display:grid;gap:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;color:var(--c,var(--type));background:color-mix(in srgb,var(--c,var(--type)) 15%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--type)) 30%,transparent)}
.chip.neutral{--c:var(--fg-2)}
.chip button{border:0;background:none;padding:0;margin:0 -4px 0 0;display:grid;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:13px;border:1px solid var(--hair-2);background:var(--surface-2);font-weight:650;font-size:14px;text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--fg);color:#0a0d12;border-color:transparent}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.danger{color:var(--late);border-color:color-mix(in srgb,var(--late) 45%,transparent)}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding:12px 14px;border-radius:16px;margin-bottom:14px;background:color-mix(in srgb,var(--c) 13%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.banner .tx{display:flex;gap:10px;align-items:flex-start;min-width:0;flex:1 1 240px} .banner .tx svg{color:var(--c);margin-top:1px}
.banner b{color:var(--c)}
ul.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.list li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:start}
ul.list li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg-3);margin:8px 0 0 5px}
ul.list li.warn{color:var(--late);font-weight:650} ul.list li.warn::before{background:var(--late)}

/* MOST: a jelenlegi blokk */
.now{position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 16px;border:1px solid color-mix(in srgb,var(--type) 38%,var(--hair));display:grid;gap:14px;justify-items:center;text-align:center;
  background:radial-gradient(130% 80% at 50% 0%,color-mix(in srgb,var(--type) 17%,transparent),transparent 62%),linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03))}
.now.enter>*{animation:rise .35s ease backwards} .now.enter>*:nth-child(2){animation-delay:.05s} .now.enter>*:nth-child(3){animation-delay:.1s}
body.over .now{border-color:color-mix(in srgb,var(--late) 75%,transparent)}
.now-head{display:grid;gap:8px;justify-items:center;min-width:0;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.now h1{margin:2px 0 0;font-size:clamp(30px,8.4vw,46px);font-weight:750;letter-spacing:-.03em;line-height:1.04;text-wrap:balance;overflow-wrap:anywhere}
.now h1.long{font-size:clamp(22px,6vw,32px)}
.now .setup{font-size:16px;font-weight:600}
.now .note{color:var(--fg-2);max-width:56ch;text-wrap:pretty}
.ring{position:relative;width:min(54vw,204px);aspect-ratio:1;max-width:100%;border:0;background:none;padding:0;border-radius:50%;color:inherit}
.ring svg.dial{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .bezel{stroke:rgba(255,255,255,.2)} .ring .trk{stroke:rgba(255,255,255,.08)}
.ring .bar{stroke:var(--type);transition:stroke-dashoffset .25s linear,stroke .5s;filter:drop-shadow(0 0 9px color-mix(in srgb,var(--type) 75%,transparent))}
body.over .ring .bar{stroke:var(--late);filter:drop-shadow(0 0 10px var(--late))}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:3px}
.ring .big{font-size:clamp(40px,12vw,52px);font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.ring .big.long{font-size:clamp(27px,8vw,36px)}
body.over .ring .big{color:var(--late)}
.ring .zoom{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);color:var(--fg-3)}
.meta{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1px;width:100%;margin:0;border-radius:var(--r-tile);overflow:hidden;background:var(--hair)}
.meta div{background:rgba(13,17,23,.72);padding:9px 6px}
.meta dt{font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.meta dd{margin:2px 0 0;font-weight:700;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.drift{font-weight:700;font-variant-numeric:tabular-nums;font-style:normal} .drift.p{color:var(--warn)} .drift.pp{color:var(--late)} .drift.m{color:var(--ok)}
.chip .wide{display:none}
@media (min-width:561px){.chip .wide{display:inline}}
@media (min-width:901px){.ring{width:232px}.ring .big{font-size:58px}.ring .big.long{font-size:40px}
  .now{grid-template-columns:auto minmax(0,1fr);justify-items:start;text-align:left;align-items:center;column-gap:26px;padding:24px}
  .now-head{justify-items:start;grid-column:2}.chips{justify-content:flex-start}.ring{grid-column:1;grid-row:1/3}.meta{grid-column:2}}

/* take-felvevő */
.rec{grid-template-columns:auto minmax(0,1fr) auto;align-items:center;transition:border-color .3s}
.rec.run{border-color:color-mix(in srgb,var(--late) 65%,transparent)}
.recbtn{width:62px;height:62px;border-radius:50%;border:3px solid rgba(255,255,255,.88);background:none;display:grid;place-items:center;padding:0}
.recbtn i{width:44px;height:44px;border-radius:50%;background:var(--late);transition:all .18s ease}
.rec.run .recbtn i{width:22px;height:22px;border-radius:6px}
.rec-time{font-size:36px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.rec.run .rec-time{color:var(--late)}
.rec .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--late);margin-right:6px;animation:blink 1s steps(2) infinite}
.rec-stat{text-align:right;font-size:12.5px;color:var(--fg-2);line-height:1.3} .rec-stat b{display:block;font-size:20px;color:var(--fg);font-weight:700}
.takes{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.take{display:inline-flex;align-items:center;gap:2px;height:34px;padding:0 4px 0 10px;border-radius:11px;background:var(--surface-2);border:1px solid var(--hair);font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.take em{font-style:normal;color:var(--fg-3);margin-right:6px}
.take.ok{border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.take button{border:0;background:none;width:30px;height:30px;display:grid;place-items:center;color:var(--fg-3);padding:0}
.take.ok button.star{color:var(--ok)} .take.ok button.star svg{fill:currentColor}

/* következő formáció */
.form-title{font-size:26px;font-weight:750;letter-spacing:-.025em;line-height:1.05}
.light{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch}
.lt{background:var(--surface-2);border:1px solid var(--hair);border-radius:var(--r-tile);padding:10px 12px;display:grid;gap:1px;min-width:0;align-content:start}
.lt b{font-size:20px;font-weight:750;letter-spacing:-.02em}.lt span:last-child{font-size:12.5px;color:var(--fg-2)}
.lt.to{border-color:color-mix(in srgb,var(--move) 55%,transparent);background:color-mix(in srgb,var(--move) 12%,transparent)}
.lt-arrow{align-self:center;color:var(--move)}
.light.same{grid-template-columns:auto minmax(0,1fr);align-items:start;background:var(--surface-2);border:1px solid var(--hair);border-radius:var(--r-tile);padding:10px 12px;color:var(--fg-2)}
.light.same b{display:block;color:var(--fg)}.light.same svg{margin-top:2px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:var(--r-tile);background:color-mix(in srgb,var(--move) 9%,transparent);border:1px dashed color-mix(in srgb,var(--move) 40%,transparent)}
.task svg{color:var(--move);margin-top:2px}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--hair);min-width:0}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#0a0d12;background:linear-gradient(135deg,#a9d0ff,#6f8cff)}
.person.n .avatar{background:linear-gradient(135deg,#ecc4ff,#b07cff)}
.person b{display:block;font-size:14px;line-height:1.15}.person small{color:var(--fg-2);font-size:12px}
.callnow{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 16%,transparent);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn);font-weight:700;animation:blink 1.2s ease-in-out infinite}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.imgs button{position:relative;padding:0;border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:#000;cursor:zoom-in;display:block}
.imgs img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.imgs .sb img{background:#fff;object-fit:contain}
.imgs span{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.72);color:#fff}
details.more summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:650;font-size:13.5px;color:var(--fg-2)}
details.more summary::-webkit-details-marker{display:none}
details.more summary svg{transition:transform .2s} details.more[open] summary svg{transform:rotate(90deg)}
details.more .inner{display:grid;gap:14px;padding-top:12px}

/* szegmensek */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid var(--hair)}
.seg button{border:0;background:none;color:var(--fg-2);height:36px;border-radius:10px;font-weight:650;font-size:13.5px;white-space:nowrap;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg)}
.sect{display:grid;gap:8px}

/* ezután lista */
.up-row{display:grid;grid-template-columns:60px 30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}
.up-row:first-child{border-top:0;padding-top:0} .up-row:last-child{padding-bottom:0}
.up-time b{display:block;font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.up-time span{font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.tico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--type);background:color-mix(in srgb,var(--type) 15%,transparent)}
.up-name{min-width:0}.up-name b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-name span{display:block;font-size:12.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-row.skip{opacity:.45}.up-row.skip b{text-decoration:line-through}

/* időrend */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:12px 14px;min-width:0}
.stat b{display:block;font-size:24px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}
.tl{display:grid}
.tl-row{display:grid;grid-template-columns:60px 16px minmax(0,1fr) auto;column-gap:10px;padding:0 10px;border-radius:16px;cursor:pointer}
.tl-row.cur{background:color-mix(in srgb,var(--type) 11%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--type) 40%,transparent)}
.tl-time{padding-top:13px;text-align:right}
.tl-time b{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tl-time span{font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-rail{position:relative;display:grid;justify-items:center}
.tl-rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--hair)}
.tl-row:first-child .tl-rail::before{top:18px}.tl-row.last .tl-rail::before{bottom:calc(100% - 18px)}
.tl-rail i{position:relative;margin-top:15px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--type)}
.tl-row.done .tl-rail i{background:var(--type)} .tl-row.cur .tl-rail i{background:var(--type);box-shadow:0 0 0 5px color-mix(in srgb,var(--type) 28%,transparent)}
.tl-body{padding:11px 0 12px;min-width:0;border-bottom:1px solid var(--hair)}
.tl-row.cur .tl-body,.tl-row.last .tl-body{border-bottom-color:transparent}
.tl-body b{font-weight:650}.tl-body .sub{font-size:12.5px;color:var(--fg-2)}
.tl-end{padding-top:12px;text-align:right;font-size:12.5px;color:var(--fg-2);min-width:44px}
.tl-row.done .tl-time b,.tl-row.done .tl-body b{color:var(--fg-2)}
.tl-row.skip{opacity:.42}.tl-row.skip .tl-body b{text-decoration:line-through}
.tl-x{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nowtag{display:inline-block;font-size:10.5px;font-weight:750;letter-spacing:.08em;color:#0a0d12;background:var(--type);border-radius:6px;padding:2px 6px}

/* szkript */

function tod(){
  if(st.sim.on)return st.sim.start+(Date.now()-st.sim.base)/60000*st.sim.speed;
  const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60+d.getMilliseconds()/60000;
}
const isShootDay=()=>{const d=new Date();return d.getFullYear()===SHOOT_DATE.getFullYear()&&d.getMonth()===SHOOT_DATE.getMonth()&&d.getDate()===SHOOT_DATE.getDate()};
const live=()=>st.sim.on||st.force||isShootDay();
const dEff=b=>b.d+(st.ext[b.i]||0);

/* ---------- vetítés: mikor mi lesz, ha így haladunk ---------- */
function project(){
  const t=tod(),P=[];let x;
  if(!st.cur){x=live()?Math.max(t,B[0].s):B[0].s;
    for(const b of B){if(st.skip[b.i]){P[b.i]={skip:1};continue}P[b.i]={s:x,e:x+dEff(b)};x+=dEff(b)}
    return{P,wrap:x,t}}
  x=null;
  for(const b of B){
    if(st.act[b.i]){P[b.i]={...st.act[b.i],done:1};continue}
    if(st.skip[b.i]){P[b.i]={skip:1};continue}
    if(b.i===st.cur.i){const s=st.cur.at,e=Math.max(t,s+dEff(b));P[b.i]={s,e,cur:1};x=e;continue}
    if(b.i>st.cur.i){const s=x??t;P[b.i]={s,e:s+dEff(b)};x=s+dEff(b)}
  }
  return{P,wrap:st.cur.i>=B.length?st.cur.at:(x??t),t};
}
const statusOf=wrap=>{const w=Math.round(wrap);return w<=PLAN_WRAP?"ok":w<=TARGET?"warn":"late"};
const nextIdx=i=>{for(let j=i+1;j<B.length;j++)if(!st.skip[j]&&!st.act[j])return j;return B.length};
const prevShoot=i=>{for(let j=i-1;j>=0;j--)if(B[j].type==="shoot"&&!st.skip[j])return B[j];return null};
const nextShoot=i=>{for(let j=i+1;j<B.length;j++)if(B[j].type==="shoot"&&!st.skip[j])return B[j];return null};
const curBlock=()=>st.cur&&st.cur.i<B.length?B[st.cur.i]:null;
const nextLabel=b=>{const nx=B[nextIdx(b.i)];if(!nx)return"WRAP";if(nx.type==="move"){const n=nextShoot(nx.i);return n?`Átállás → ${n.label}`:nx.label}return nx.label};

/* ---------- vezérlés ---------- */
function startDay(){st.cur={i:nextIdx(-1),at:tod()};save();renderAll();cue(1)}
let lastAdv=0;
function advance(){
  if(Date.now()-lastAdv<700)return;lastAdv=Date.now();
  if(!st.cur)return startDay();
  const t=tod(),b=curBlock();if(!b)return;
  st.act[b.i]={s:st.cur.at,e:t};if(st.sw)stopSW(true);
  st.cur={i:nextIdx(b.i),at:t};save();renderAll();cue(1);
  toast(`Lezárva: ${b.label} · ${Math.max(1,Math.round(t-st.act[b.i].s))}′`,{action:"Visszavonás",fn:back});
}
function back(){
  if(!st.cur)return;
  let j=-1;for(const k of Object.keys(st.act).map(Number))if(k<st.cur.i&&k>j)j=k;
  if(j<0){st.cur=null;save();return renderAll()}
  st.cur={i:j,at:st.act[j].s};delete st.act[j];save();renderAll();
}
function jump(j){
  const t=tod(),b=curBlock();
  if(b)st.act[b.i]={s:st.cur.at,e:t};
  for(const k of Object.keys(st.act).map(Number))if(k>=j)delete st.act[k];
  if(st.cur)for(let k=st.cur.i+1;k<j;k++)if(!st.act[k])st.skip[k]=true;
  delete st.skip[j];st.cur={i:j,at:t};save();renderAll();toast(`Most megy: ${B[j].label}`);
}
function toggleSkip(j,quiet){
  if(st.cur&&j===st.cur.i)return;
  if(st.skip[j])delete st.skip[j];else st.skip[j]=true;save();renderAll();
  if(!quiet)toast(st.skip[j]?`Kihagyva: ${B[j].label} (−${B[j].d}′)`:`Visszavéve: ${B[j].label}`,{action:"Visszavonás",fn:()=>toggleSkip(j,true)});
}
function extend(m){const b=curBlock();if(!b)return;st.ext[b.i]=Math.max(0,(st.ext[b.i]||0)+m);if(!st.ext[b.i])delete st.ext[b.i];lastAlert="";save();renderAll();
  toast(m>0?`+${m} perc erre a blokkra · várható wrap ${hm(project().wrap)}`:"Hosszabbítás törölve",m>0?{action:"Visszavonás",fn:()=>extend(-m)}:{})}
function startSW(){if(st.sw)return;st.sw={at:tod(),i:st.cur?st.cur.i:"gen"};save();renderMost()}
function stopSW(silent){if(!st.sw)return;const d=(tod()-st.sw.at)*60,k=st.sw.i;(st.takes[k]=st.takes[k]||[]).push({d,ok:false});st.sw=null;save();if(!silent)renderMost()}

/* ---------- hang, rezgés, ébren tartás, toast ---------- */
let actx=null;
function cue(n=1,freq=880,vib){
  if(vib)try{navigator.vibrate&&navigator.vibrate(vib)}catch(e){}
  if(!st.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();
    for(let k=0;k<n;k++){const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+k*.28;o.frequency.value=freq;o.type="sine";
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.35,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.24);o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+.26)}}catch(e){}
}
let wl=null;async function wake(){try{if("wakeLock" in navigator&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});
document.addEventListener("pointerdown",()=>{wake();try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
function toast(msg,o={}){
  const box=$("#toasts");box.innerHTML="";
  const el=document.createElement("div");el.className="toast";if(o.tone)el.dataset.tone=o.tone;
  const sp=document.createElement("span");sp.textContent=msg;el.append(sp);
  if(o.action){const b=document.createElement("button");b.type="button";b.textContent=o.action;b.onclick=()=>{el.remove();o.fn()};el.append(b)}
  box.append(el);setTimeout(()=>el.remove(),o.ms||(o.action?7000:4200));
}

/* ---------- képnagyító, kivetítő ---------- */
const V={list:[],i:0,a:1.5,nw:0,z:1,x:0,y:0,ptrs:new Map(),tok:0,tap:null,g:null};
$("#vclose").innerHTML=ic("x",22);$("#vprev").innerHTML=ic("left",22);$("#vnext").innerHTML=ic("chev",22);$("#vout").innerHTML=ic("minus",22);$("#vin").innerHTML=ic("plus",22);
const vStage=$("#vstage"),vImg=$("#vimg");
function vBase(){const sw=vStage.clientWidth,sh=vStage.clientHeight,bw=Math.min(sw,sh*V.a);return{sw,sh,bw,bh:bw/V.a}}
const vMax=()=>{const{bw}=vBase();return Math.max(4,V.nw?V.nw/bw:8)};
function vApply(){
  const{sw,sh,bw,bh}=vBase();V.z=Math.min(vMax(),Math.max(1,V.z));const W=bw*V.z,H=bh*V.z;
  V.x=W<=sw?(sw-W)/2:Math.min(0,Math.max(sw-W,V.x));V.y=H<=sh?(sh-H)/2:Math.min(0,Math.max(sh-H,V.y));
  vImg.style.width=W+"px";vImg.style.height=H+"px";vImg.style.transform=`translate3d(${V.x}px,${V.y}px,0)`;
  $("#vfit").textContent=V.z<1.02?"Teljes":(V.z<10?V.z.toFixed(1):Math.round(V.z))+"×";$("#vout").disabled=V.z<=1.001;$("#vin").disabled=V.z>=vMax()-.001;
}
function vZoomAt(cx,cy,nz){nz=Math.min(vMax(),Math.max(1,nz));const k=nz/V.z;V.x=cx-(cx-V.x)*k;V.y=cy-(cy-V.y)*k;V.z=nz;vApply()}
const vCenter=()=>{const{sw,sh}=vBase();return[sw/2,sh/2]};
function vLoad(){
  const it=V.list[V.i],tok=++V.tok,ld=$("#vload");
  $("#vcap").textContent=it.cap;$("#vcount").textContent=V.list.length>1?`${V.i+1} / ${V.list.length}`:"";
  $("#vprev").hidden=$("#vnext").hidden=V.list.length<2;
  V.z=1;V.x=V.y=0;V.nw=0;vImg.style.visibility="hidden";
  const show=(src,w,h,isFull)=>{if(tok!==V.tok)return;V.a=w/h;if(isFull)V.nw=w;vImg.src=src;vImg.style.visibility="";vApply()};
  if(it.t&&it.t!==it.f){const th=new Image();th.onload=()=>{if(!V.nw)show(it.t,th.naturalWidth,th.naturalHeight,false)};th.src=it.t}
  ld.hidden=false;ld.textContent="Teljes minőség betöltése…";
  const full=new Image();full.decoding="async";
  full.onload=()=>{if(tok!==V.tok)return;const keep=[V.z,V.x,V.y];show(it.f,full.naturalWidth,full.naturalHeight,true);[V.z,V.x,V.y]=keep;vApply();ld.hidden=true};
  full.onerror=()=>{if(tok!==V.tok)return;ld.textContent="A teljes minőségű kép most nem érhető el"};
  full.src=it.f;
}
function openViewer(list,i){if(!list.length)return;V.list=list;V.i=Math.max(0,i);$("#viewer").hidden=false;const h=$("#vhint");h.style.opacity="1";setTimeout(()=>{h.style.opacity="0"},2600);vLoad()}
function closeViewer(){$("#viewer").hidden=true;V.tok++;V.ptrs.clear();vImg.removeAttribute("src")}
const vStep=d=>{if(V.list.length<2)return;V.i=(V.i+d+V.list.length)%V.list.length;vLoad()};
$("#vclose").onclick=closeViewer;$("#vprev").onclick=()=>vStep(-1);$("#vnext").onclick=()=>vStep(1);
$("#vin").onclick=()=>vZoomAt(...vCenter(),V.z*1.6);$("#vout").onclick=()=>vZoomAt(...vCenter(),V.z/1.6);$("#vfit").onclick=()=>{V.z=1;vApply()};
vStage.addEventListener("pointerdown",e=>{
  try{vStage.setPointerCapture(e.pointerId)}catch(x){}
  V.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});vStage.classList.add("drag");
  if(V.ptrs.size===1)V.g={t:Date.now(),sx:e.clientX,sy:e.clientY,moved:0,multi:false};
  if(V.ptrs.size===2){const[p,q]=[...V.ptrs.values()];V.g.multi=true;V.pin={d:Math.hypot(p.x-q.x,p.y-q.y)||1,z:V.z,mx:(p.x+q.x)/2,my:(p.y+q.y)/2}}
});
vStage.addEventListener("pointermove",e=>{
  const o=V.ptrs.get(e.pointerId);if(!o)return;const dx=e.clientX-o.x,dy=e.clientY-o.y;o.x=e.clientX;o.y=e.clientY;
  if(V.ptrs.size>=2&&V.pin){const[p,q]=[...V.ptrs.values()],d=Math.hypot(p.x-q.x,p.y-q.y)||1,mx=(p.x+q.x)/2,my=(p.y+q.y)/2;
    V.x+=mx-V.pin.mx;V.y+=my-V.pin.my;V.pin.mx=mx;V.pin.my=my;vZoomAt(mx,my,V.pin.z*d/V.pin.d)}
  else if(V.ptrs.size===1){if(V.g)V.g.moved+=Math.abs(dx)+Math.abs(dy);if(V.z>1.001){V.x+=dx;V.y+=dy;vApply()}}
});
function vUp(e){
  if(!V.ptrs.has(e.pointerId))return;V.ptrs.delete(e.pointerId);
  if(V.ptrs.size<2)V.pin=null;if(V.ptrs.size)return;vStage.classList.remove("drag");
  const g=V.g;V.g=null;if(!g||g.multi||e.type==="pointercancel")return;
  const dx=e.clientX-g.sx,dy=e.clientY-g.sy,dt=Date.now()-g.t;
  if(g.moved<10&&dt<320){ // koppintás: a második gyors koppintás nagyít vagy visszaáll
    if(V.tap&&Date.now()-V.tap.t<340&&Math.hypot(e.clientX-V.tap.x,e.clientY-V.tap.y)<40){V.tap=null;if(V.z>1.05){V.z=1;vApply()}else vZoomAt(e.clientX,e.clientY,Math.min(vMax(),3))}
    else V.tap={t:Date.now(),x:e.clientX,y:e.clientY};return}
  if(V.z<=1.001&&dt<600){if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)vStep(dx<0?1:-1);else if(dy>110&&dy>Math.abs(dx)*1.4)closeViewer()}
}
vStage.addEventListener("pointerup",vUp);vStage.addEventListener("pointercancel",vUp);
vStage.addEventListener("wheel",e=>{e.preventDefault();vZoomAt(e.clientX,e.clientY,V.z*Math.exp(-e.deltaY*(e.ctrlKey?.012:.0022)))},{passive:false});
$("#viewer").addEventListener("gesturestart",e=>e.preventDefault());
addEventListener("resize",()=>{if(!$("#viewer").hidden)vApply()});
addEventListener("keydown",e=>{if($("#viewer").hidden)return;const k=e.key;if(k==="Escape")closeViewer();else if(k==="+"||k==="=")$("#vin").click();else if(k==="-")$("#vout").click();else if(k==="0")$("#vfit").click();else if(k==="ArrowLeft")vStep(-1);else if(k==="ArrowRight")vStep(1)});
document.addEventListener("click",e=>{const z=e.target.closest("[data-full]");if(!z)return;
  const group=[...(z.closest("[data-gallery]")||z.parentElement).querySelectorAll("[data-full]")];
  openViewer(group.map(x=>({f:x.dataset.full,t:x.dataset.thumb,cap:x.dataset.cap||""})),group.indexOf(z))});
function present(on){const p=$("#present");p.hidden=!on;if(on){tick(true);try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
  else{try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}}
$("#present").onclick=()=>present(false);

/* ---------- építőelemek ---------- */
const typeChip=b=>`<span class="chip" data-type="${b.type}">${ic(b.type,15)}${esc(TNAME[b.type])}</span>`;
const G=g=>D.groups[g]||null;
const groupChip=g=>g&&G(g)?`<span class="chip neutral" title="${esc(G(g)[0])}">${ic("bolt",14)}${esc(g)}<span class="wide"> · ${esc(G(g)[0])}</span></span>`:"";
function people(names){return`<div class="people">${names.map(n=>{const c=CASTBY[n];return`<div class="person ${n==="Nagyi"?"n":""}"><span class="avatar">${esc(n[0])}</span><span><b>${esc(c?c.name:n)}</b><small>${esc(n)}</small></span></div>`}).join("")}</div>`}
function screenplay(lines){return lines.map(l=>{const c={ac:"ac",ch:"ch",pa:"pa",dl:"dl",sh:"sh",end:"end"}[l.t];return c?`<div class="${c}">${esc(l.x)}</div>`:""}).join("")}
const imgBtn=(x,cap,cls)=>`<button type="button" class="${cls}" data-full="${x.f}" data-thumb="${x.t}" data-cap="${esc(cap)} · ${esc(x.id)}"><img src="${x.t}" alt="${esc(cap)} ${esc(x.id)}" loading="lazy"><span>${esc(cap)}${cls==="vk"?" · "+esc(x.id):""}</span></button>`;

const sbThumb=(x,cls)=>`<button type="button" class="sbt ${cls||""}" data-full="${x.f}" data-thumb="${x.t}" data-cap="Storyboard · ${esc(x.id)}" aria-label="Storyboard ${esc(x.id)} megnyitása"><img src="${x.t}" alt="" loading="lazy"></button>`;
const propList=ps=>`<ul class="list">${ps.map(p=>`<li class="${/BIZTONSÁG/.test(p)?"warn":""}">${esc(p)}</li>`).join("")}</ul>`;
function lightHTML(from,to){
  const gf=G(from),gt=G(to);if(!to||!gt)return"";
  if(from===to)return`<div class="light same">${ic("bolt",18)}<div><b>A fény marad</b>${esc(to)} · ${esc(gt[0])}</div></div>`;
  if(!from||!gf)return`<div class="sect"><div class="light same">${ic("bolt",18)}<div><b>Fény: ${esc(to)} · ${esc(gt[0])}</b>${esc(gt[1])}</div></div></div>`;
  return`<div class="sect"><div class="light"><div class="lt"><span class="cap">Most</span><b>${esc(from)}</b><span>${esc(gf[0])}</span></div><span class="lt-arrow">${ic("arrow",22)}</span><div class="lt to"><span class="cap">Erre vált</span><b>${esc(to)}</b><span>${esc(gt[0])}</span></div></div><p class="muted small">${esc(gt[1])}</p></div>`;

function ringHTML(){return`<button class="ring" type="button" id="ring" aria-label="Kivetítő mód: óra teljes képernyőn"><svg class="dial" viewBox="0 0 120 120"><circle class="bezel" cx="60" cy="60" r="57" fill="none" stroke-width="1.5" stroke-dasharray="1 4.969"/><circle class="trk" cx="60" cy="60" r="50" fill="none" stroke-width="7"/><circle class="bar" id="ringbar" cx="60" cy="60" r="50" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16"/></svg><span class="mid"><span class="cap" id="ringcap"></span><span class="big" id="ringbig">--:--</span><span class="cap" id="ringsub"></span></span><span class="zoom">${ic("max",15)}</span></button>`}

/* ---------- MOST ---------- */
let lastHero=null,detailSeg="setre";
function renderMost(){
  const v=$('[data-view="most"]'),{P,t}=project(),b=curBlock();
  const key=st.cur?st.cur.i:-1,enter=key!==lastHero;lastHero=key;
  let hero,left="",right="";
  if(!st.cur){
    const f=B[nextIdx(-1)]||B[0],lv=live();
    hero=`<section class="now ${enter?"enter":""}" data-type="prep"><div class="now-head"><div class="chips"><span class="chip neutral">${ic("now",15)}${lv?"A nap még nem indult":"Forgatási nap: "+SHOOT_DATE.toLocaleDateString("hu-HU",{month:"long",day:"numeric"})}</span></div>
      <h1>Crew call ${hm(D.plan.call)}</h1><p class="setup">Első blokk: ${esc(f.label)}</p>
      <p class="note">${lv?"Indítsd el a napot, amikor a stáb megérkezett. Utána minden blokk végén a Kész gomb visz tovább.":"Ma kipróbálhatod próba módban: gyorsított órával végigmehetsz az egész napon."}</p><button class="btn sm" type="button" id="tourbtn">${ic("play",14)}Bemutató · 1 perc</button></div>${ringHTML()}
      <dl class="meta"><div><dt>Forgatás</dt><dd>${hm((B.find(x=>x.type==="shoot")||f).s)}</dd></div><div><dt>Ebéd</dt><dd>${hm((B.find(x=>x.type==="lunch")||{}).s)}</dd></div><div><dt>Wrap</dt><dd>${hm(PLAN_WRAP)}</dd></div></dl></section>`;
    right=upcomingCard(P)+callsCard(t)+arrivalsCard();
  }else if(!b){
    const shots=B.filter(x=>x.type==="shoot"&&st.act[x.i]).length,takes=Object.values(st.takes).reduce((a,x)=>a+x.length,0),d=st.cur.at-PLAN_WRAP;
    hero=`<section class="now ${enter?"enter":""}" data-type="pres"><div class="now-head"><div class="chips"><span class="chip" style="--c:var(--ok)">${ic("check",15)}Wrap</span></div><h1>Forgatás vége</h1>
      <p class="note">Bontás, pakolás, napi riport.</p></div>${ringHTML()}
      <dl class="meta"><div><dt>Terv</dt><dd>${hm(PLAN_WRAP)}</dd></div><div><dt>Eltérés</dt><dd><span class="drift ${driftCls(d)}">${signMin(d)}</span></dd></div><div><dt>Shot</dt><dd>${shots}</dd></div><div><dt>Take</dt><dd>${takes}</dd></div></dl></section>`;
  }else{
    const n=nextShoot(b.i),isMove=b.type==="move",title=isMove&&n?n.label:b.label,ext=st.ext[b.i]||0,dr=st.cur.at-b.s;
    const setup=isMove?[/^(átállás|optikacsere)$/i.test(b.label)?"":b.label,b.setup].filter(Boolean).join(" · "):b.setup;
    hero=`<section class="now ${enter?"enter":""}" data-type="${b.type}"><div class="now-head"><div class="chips">${typeChip(b)}${groupChip(b.group)}${ext?`<span class="chip" style="--c:var(--warn)">+${ext}′ hosszabbítás<button type="button" id="extclr" aria-label="Hosszabbítás törlése">${ic("x",14)}</button></span>`:""}</div>
      ${isMove&&n?`<span class="cap">Átállás erre a beállításra</span>`:""}<h1 class="${title.length>22?"long":""}">${esc(title)}</h1>
      ${setup?`<p class="setup">${esc(setup)}</p>`:""}${b.note?`<p class="note">${esc(b.note)}</p>`:""}</div>${ringHTML()}
      <dl class="meta"><div><dt>Terv</dt><dd>${hm(b.s)}–${hm(b.e)}</dd></div><div><dt>Indult</dt><dd>${hm(st.cur.at)} <span class="drift ${driftCls(dr)}">${Math.abs(dr)>=1?signMin(dr):""}</span></dd></div><div><dt>Keret</dt><dd>${dEff(b)}′</dd></div></dl></section>`;
    if(b.type==="shoot"){left=recCard(b)+shootDetail(b);right=formationCard(b,P)+upcomingCard(P)}
    else if(isMove){left=formationCard(b,P);right=upcomingCard(P)+callsCard(t)}

  }
  v.innerHTML=`<div id="banners"></div><div class="grid"><div class="stack">${hero}${left}</div><div class="stack">${right}</div></div>`;
  renderDock();bindMost(v);tick(true);
}
function bindMost(v){
  const on=(sel,fn)=>v.querySelectorAll(sel).forEach(x=>x.onclick=e=>fn(x,e));
  on("#ring",()=>present(true));on("#tourbtn",()=>tourStart());on("#extclr",()=>extend(-(st.ext[st.cur.i]||0)));

    ${contacts.length?`<section class="card"><h2>Kulcs-telefonszámok</h2><div class="rows">${contacts.map(c=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div><b>${esc(c.name)}</b><small>${esc(c.role)}</small><div class="phone">${esc(c.phone)}</div></div><button class="btn sm" type="button" data-copy="${esc(c.phone)}">${ic("copy",15)}Másol</button></div>`).join("")}</div></section>`:""}
    </div><div class="stack"><section class="card" style="gap:0"><h2 style="margin-bottom:12px">Stáb</h2>${deps.map(d=>`<div class="dept"><span class="cap">${esc(d)}</span></div><div class="rows">${D.crew.filter(c=>c.dept===d).map(c=>{const m=toMin(c.arr),late=live()&&!st.checkin[c.name]&&m!=null&&t>m+5;return`<div class="row">${chk(c.name)}<div><b>${esc(c.name)}</b><small>${esc(c.pos)}</small></div><span class="t ${late?"late":""}">${esc(c.arr)}</span></div>`}).join("")}</div>`).join("")}</section></div></div>`;
  v.querySelectorAll("[data-in]").forEach(x=>x.onchange=()=>{st.checkin[x.dataset.in]=x.checked;save();renderCrew()});
  v.querySelectorAll("[data-copy]").forEach(x=>x.onclick=()=>{const p=x.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(p):Promise.reject()).then(()=>toast("Kimásolva: "+p,{tone:"ok"}),()=>toast("Tartsd nyomva a számot a másoláshoz"))});
}

  if(D.info["munkaidő"])notes.push(`Munkaidő a táblázat szerint: ${D.info["munkaidő"]}.`);
  v.innerHTML=`<div class="vh">Info</div><div class="grid"><div class="stack">
    <section class="card"><div class="card-head"><h2>Így működik</h2><button class="btn sm solid" type="button" id="tourgo">${ic("play",14)}Bemutató · 1 perc</button></div>
      <ul class="list"><li><b>Kész</b>: lezárja a mostani blokkot, és indítja a következőt.</li><li><b>‹</b> visszalép az előző blokkra. <b>+5′</b> öt percet ad a mostanihoz.</li><li>Zöld: terv szerint. Narancs: késés, de belefér a tartalékba. Piros: a wrap ${hm(TARGET)} utánra csúszik, vagy a blokk kerete lejárt.</li><li>A gyűrűre koppintva teljes képernyős óra a stábnak.</li><li>Az Időrendben egy sorra koppintva odaugorhatsz vagy kihagyhatod.</li></ul></section>
    <section class="card"><h2>Próba mód</h2><p class="muted small">Gyorsított órával végigpróbálhatod a napot. A próba befejezése mindent nulláz, hogy a forgatás tiszta lappal induljon.</p>
      <div class="field"><label class="field">Kezdés <input type="time" id="simt" value="${hm(st.sim.start).padStart(5,"0")}"></label><label class="field">Sebesség <select id="simsp">${[1,5,10,30,60].map(x=>`<option value="${x}" ${st.sim.speed===x?"selected":""}>${x}×</option>`).join("")}</select></label></div>
      <div class="field"><button class="btn ${st.sim.on?"":"solid"}" type="button" id="simon">${st.sim.on?"Újraindítás ezzel":"Próba indítása"}</button>${st.sim.on?`<button class="btn danger" type="button" id="simoff">Próba befejezése és nullázás</button>`:""}</div></section>
    <section class="card"><h2>Jelzések</h2><div class="rows">
      <div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div><b>Hang és rezgés</b><small>5 perccel a keret vége előtt és lejáratkor</small></div><input type="checkbox" class="sw" id="snd" ${st.sound?"checked":""} aria-label="Hangjelzés"></div>
      <div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div><b>Ma forgatunk</b><small>Kapcsold be, ha a forgatás nem ${SHOOT_DATE.toLocaleDateString("hu-HU",{month:"long",day:"numeric"})}-én van</small></div><input type="checkbox" class="sw" id="force" ${st.force?"checked":""} aria-label="Ma forgatunk"></div></div>
      <div class="field"><button class="btn sm" type="button" id="sndtest">Hang kipróbálása</button></div>
      <p class="muted small">A képernyőt az app ébren tartja, amíg nyitva van. Ha mégis elsötétül, koppints egyet.</p></section>
    <section class="card"><h2>Nap nullázása</h2><p class="muted small" id="savest">Az állapot ezen az eszközön mentődik${cloud.ok?", és a fiókodban is":""}. Forrás: ${esc(D.src)}</p>
      ${confirmReset?`<p style="color:var(--late);font-weight:650">Biztosan nullázod? A lezárt blokkok, take-ek és érkezések törlődnek.</p><div class="field"><button class="btn danger" type="button" id="rsyes">Igen, nullázom</button><button class="btn" type="button" id="rsno">Mégse</button></div>`:`<div class="field"><button class="btn danger" type="button" id="rs">Nap nullázása</button></div>`}</section>
    </div><div class="stack">
    <section class="card"><h2 style="color:var(--late)">Biztonság</h2><ul class="list"><li class="warn">A rúd ráesése (2/6): csak üres vagy könnyített rúddal, mellette biztosító.</li><li>Soma: a 2/2-ben legfeljebb 3 teljes erőkifejtéses take, a próbák könnyített rúddal.</li><li>12K és kábelek: eligazítás reggel.</li></ul></section>
    ${D.boards&&D.boards.length?`<section class="card"><div class="card-head"><h2>Storyboard</h2><span class="chip neutral num">${D.boards.length} rajz</span></div><div class="vkgrid sb" data-gallery>${D.boards.map(x=>`<button type="button" data-full="${x.f}" data-thumb="${x.t}" data-cap="Storyboard · ${esc(x.id)}"><img src="${x.t}" alt="Storyboard ${esc(x.id)}" loading="lazy"><span>${esc(x.id)}</span></button>`).join("")}</div><p class="muted small">A shotlist rajzai forgatási sorrendben. A 3. jelenethez és a montázshoz nincs rajz.</p></section>`:""}
    ${D.vilko&&D.vilko.length?`<section class="card"><div class="card-head"><h2>Világítási tervek</h2><span class="chip neutral num">${D.vilko.length} db</span></div><div class="vkgrid" data-gallery>${D.vilko.map(x=>`<button type="button" data-full="${x.f}" data-thumb="${x.t}" data-cap="Vilkó · ${esc(x.id)}"><img src="${x.t}" alt="Vilkó ${esc(x.id)}" loading="lazy"><span>${esc(x.id)}</span></button>`).join("")}</div><p class="muted small">Koppints egyre: teljes minőségben nyílik meg, csíptetéssel nagyítható.</p></section>`:""}
    <section class="card"><h2>Fénybeállítások</h2><div class="rows">${Object.entries(D.groups).map(([k,g])=>`<div class="row" style="grid-template-columns:52px minmax(0,1fr);align-items:start"><b style="font-size:18px">${esc(k)}</b><div><b>${esc(g[0])}</b><small>${esc(g[1])}</small></div></div>`).join("")}</div></section>
    ${notes.length?`<section class="card"><h2>Ellenőrizd</h2><ul class="list">${notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></section>`:""}
    </div></div>`;
  const g=id=>v.querySelector(id);
  g("#tourgo").onclick=()=>tourStart();
  g("#simon").onclick=()=>{const[h,m]=g("#simt").value.split(":").map(Number);const keep=fresh();keep.sound=st.sound;keep.force=st.force;keep.sim={on:true,start:h*60+m,speed:+g("#simsp").value,base:Date.now()};st=keep;save();location.hash="#most";renderAll();toast(`Próba mód: ${g("#simt").value} · ${st.sim.speed}×`)};
  g("#simoff")&&(g("#simoff").onclick=()=>{const keep=fresh();keep.sound=st.sound;keep.force=st.force;st=keep;save();renderAll();toast("Próba befejezve, a nap nullázva",{tone:"ok"})});
  g("#snd").onchange=e=>{st.sound=e.target.checked;save()};
  g("#force").onchange=e=>{st.force=e.target.checked;save();renderAll()};
  g("#sndtest").onclick=()=>{const was=st.sound;st.sound=true;cue(2,740,[120,80,120]);st.sound=was};
  g("#rs")&&(g("#rs").onclick=()=>{confirmReset=true;renderInfo()});
  g("#rsno")&&(g("#rsno").onclick=()=>{confirmReset=false;renderInfo()});
  g("#rsyes")&&(g("#rsyes").onclick=()=>{const keep=fresh();keep.sound=st.sound;keep.force=st.force;keep.sim=st.sim;st=keep;confirmReset=false;save();renderAll();toast("A nap nullázva",{tone:"ok"})});
}

/* ---------- útvonal ---------- */
const VIEWS=[["most","Most","now"],["idorend","Időrend","list"],["szkript","Szkript","doc"],["stab","Stáb","users"],["info","Info","sliders"]];
$("#tabs").innerHTML=VIEWS.map(([k,l,i])=>`<a href="#${k}">${ic(i,21)}<span>${l}</span></a>`).join("");
let view="most";
function route(scroll){
  const h=location.hash.slice(1);view=VIEWS.some(v=>v[0]===h)?h:"most";
  $$("[data-view]").forEach(s=>s.hidden=s.dataset.view!==view);
  $$(".tabs a").forEach(a=>{if(a.getAttribute("href")==="#"+view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  $("#dock").hidden=view!=="most";
  ({most:renderMost,idorend:renderTimeline,szkript:renderScript,stab:renderCrew,info:renderInfo})[view]();
  if(view!=="most")tick(true);
  if(scroll){window.scrollTo({top:0});
    if(view==="idorend"){const c=document.querySelector(".tl-row.cur");c&&c.scrollIntoView({block:"center"})}
    if(view==="szkript")scrollToHot()}
}
const renderAll=()=>route(false);
addEventListener("hashchange",()=>{openRow=null;route(!tour);if(tour)tourPlace()});

/* ---------- felhő-mentés (ha elérhető) ---------- */
const cloud={ok:false,ref:null,busy:false,again:false};let cloudT;
function cloudSave(){if(!cloud.ok)return;clearTimeout(cloudT);cloudT=setTimeout(async()=>{if(cloud.busy){cloud.again=true;return}cloud.busy=true;try{await cloud.ref.set({json:JSON.stringify(st),upd:st.upd})}catch(e){}cloud.busy=false;if(cloud.again){cloud.again=false;cloudSave()}},1200)}
(async()=>{try{
  const use=window.claude&&window.claude.use;if(!use)return;
  const db=await use("db"),user=await use("user");if(!db||!user)return;
  const id=await user.id();if(!id)return;cloud.ref=db.collection("data/users/"+id).doc("adstate");cloud.ok=true;
  cloud.ref.onSnapshot(snap=>{if(!snap.exists)return;const d=snap.data();if(tour){tour.cloud=d;return}if(d&&d.upd>st.upd){try{const x=JSON.parse(d.json);if(x&&x.v===1){st=Object.assign(fresh(),x);try{localStorage.setItem(KEY,d.json)}catch(e){}renderAll()}}catch(e){}}},()=>{});
}catch(e){}})();

/* ---------- bemutató: mintanapon vezet végig, a valódi állapotot nem érinti ---------- */
const TOUR_KEY="kap-tour-v1";
const TOUR_SHOT=B.find(b=>b.type==="shoot"&&/^2\/4/.test(b.label)&&B[b.i+1]&&B[b.i+1].type==="move")||B.find(b=>b.type==="shoot"&&B[b.i+1]&&B[b.i+1].type==="move"&&b.i>3)||B.find(b=>b.type==="shoot");
const HERO='[data-view="most"] .now';
const TOUR=[
 {title:"Egy perc, és mindent tudsz",html:"Végigvezetlek az appon egy <b>mintanapon</b>. A valódi napodhoz és a mentett állapotodhoz ez nem nyúl."},
 {state:"shoot",sel:HERO,title:"Ez megy most",html:"Itt látod, <b>mit forgatunk éppen</b>, milyen beállítással, a táblázatból vett megjegyzéssel. Alul a terv, a tényleges kezdés és a blokk időkerete."},
 {state:"shoot",sel:"#ring",title:"Visszaszámláló",html:"A gyűrű a blokkra szánt időt számolja vissza. Ha lejár, <b>pirosra vált</b>, és azt mutatja, mennyivel csúsztál túl. <b>Koppints rá</b>, és teljes képernyős óra lesz belőle a stábnak."},
 {state:"shoot",sel:".hdr",title:"Hol tart a nap",html:"Balra a pontos idő, jobbra a <b>várható wrap</b>: az app abból számolja, ahol tényleg tartotok. A csík az egész nap, a fehér vonal a mostani pillanat.",
  extra:`<div class="legend"><div><i style="background:var(--ok);color:var(--ok)"></i>Zöld: terv szerint haladtok</div><div><i style="background:var(--warn);color:var(--warn)"></i>Narancs: késés, de belefér a tartalékba</div><div><i style="background:var(--late);color:var(--late)"></i>Piros: a wrap ${hm(TARGET)} utánra csúszik</div></div>`},
 {state:"shoot",sel:"#go",title:"Kész: ezt nyomod a legtöbbször",html:"Amikor egy blokk véget ér, nyomd meg a <b>Kész</b> gombot. Az app rögzíti az időt, és elindítja a következő blokkot. A gomb alján mindig látod, mi jön."},
 {state:"shoot",sel:"#dock",title:"Vissza és +5 perc",html:"<b>‹</b>&nbsp; Mellényomtál? Visszalép az előző blokkra. Minden lépés után pár másodpercig egy Visszavonás gomb is megjelenik.<br><b>+5′</b>&nbsp; Több idő kell? Öt percet ad a mostani blokkhoz, a várható wrap azonnal frissül."},
 {state:"shoot",sel:".rec",title:"Take-ek",html:"A piros gomb indítja és megállítja a take stopperét. A take-ek sorban megjelennek alatta, a <b>csillaggal</b> megjelölöd a jót."},
 {state:"shoot",sel:"#detailcard",title:"Minden, ami a shothoz kell",html:"Fent a shot <b>storyboard-rajza és világítási terve</b>: koppintásra teljes minőségben nyílnak meg, csíptetéssel nagyíthatók. <b>Setre · kellék:</b> kit kell hívni, mi legyen a képben. <b>Felsnitt:</b> a szövegrész, amit most veszünk."},
 {state:"shoot",sel:"#formcard",title:"Mi jön utána",html:"Már forgatás közben látod a következő beállítást: mennyi idő az átállás, <b>változik-e a fény</b>, és kit kell majd a setre hívni. Így időben szólhatsz a részlegeknek."},
 {state:"move",sel:HERO,title:"Átállás",html:"Átálláskor a kártya azt mutatja, <b>mire álltok át</b>. Alatta ott a fényváltás, a kellékek, a storyboard és a vilkó. Öt perccel a vége előtt az app jelez: <b>Színészeket a setre!</b>"},
 {state:"move",sel:"#tabs",title:"A többi nézet",html:"<b>Időrend:</b> az egész nap; egy sorra koppintva odaugorhatsz vagy kihagyhatod. <b>Szkript:</b> a teljes szöveg, shotonként jelölve. <b>Stáb:</b> érkezések pipálása. <b>Info:</b> próba mód, hang, nullázás."},
 {state:"move",title:"Ennyi az egész",html:"Forgatás előtt érdemes egyszer végigmenni a napon <b>próba módban</b>, gyorsított órával. Ezt a bemutatót az Info fülön bármikor újranézheted."}
];
function tourState(kind){
  if(tour.state===kind)return;tour.state=kind;
  const sb=TOUR_SHOT,s=fresh(),now=Date.now();s.sound=false;
  for(const b of B)if(b.i<sb.i)s.act[b.i]={s:b.s,e:b.e};
  const mv=B[sb.i+1];
  if(kind==="move"&&mv){s.act[sb.i]={s:sb.s+2,e:sb.e+2};s.sim={on:true,start:mv.s+5,speed:1,base:now};s.cur={i:mv.i,at:mv.s+2}}
  else{s.sim={on:true,start:sb.s+11,speed:1,base:now};s.cur={i:sb.i,at:sb.s+2};s.takes[sb.i]=[{d:47,ok:false},{d:52,ok:true}]}
  st=s;detailSeg="setre";
}
function tourStart(){
  if(tour)return;present(false);closeViewer();
  let canDemo=!st.cur&&!isShootDay();
  tour={i:0,state:null,backup:JSON.stringify(st),canDemo};
  $("#tour").hidden=false;tourShow();
}
function tourShow(){
  const s=TOUR[tour.i],first=tour.i===0,last=tour.i===TOUR.length-1;
  tourState(s.state||"shoot");
  if(view!=="most")location.hash="#most";
  renderAll();
  const card=$("#tourcard");
  card.innerHTML=`<div class="tour-top"><span class="cap">Bemutató${first||last?"":` · ${tour.i} / ${TOUR.length-2}`}</span>${last?"":`<button type="button" class="tour-skip" id="tskip">Kihagyás</button>`}</div>
    <h3 id="tourh">${s.title}</h3><p>${s.html}</p>${s.extra||""}
    <div class="tour-nav">${last?'<span style="flex:1"></span>':`<div class="dots">${TOUR.map((_,k)=>`<i class="${k===tour.i?"on":""}"></i>`).join("")}</div>`}${first?"":`<button type="button" class="btn sm" id="tprev">Vissza</button>`}${last?(tour.canDemo?`<button type="button" class="btn sm" id="tclose">Bezárás</button><button type="button" class="btn sm solid" id="tdemo">Próba indítása</button>`:`<button type="button" class="btn sm solid" id="tclose">Kész</button>`):`<button type="button" class="btn sm solid" id="tnext">${first?"Kezdjük":"Tovább"}</button>`}</div>`;
  const g=id=>card.querySelector(id);
  g("#tnext")&&(g("#tnext").onclick=()=>tourGo(1));g("#tprev")&&(g("#tprev").onclick=()=>tourGo(-1));
  g("#tskip")&&(g("#tskip").onclick=()=>tourEnd(false));g("#tclose")&&(g("#tclose").onclick=()=>tourEnd(false));g("#tdemo")&&(g("#tdemo").onclick=()=>tourEnd(true));
  requestAnimationFrame(()=>{tourPlace();card.tabIndex=-1;card.focus({preventScroll:true})});
}
function tourGo(d){if(!tour)return;const n=tour.i+d;if(n<0)return;if(n>=TOUR.length)return tourEnd(false);tour.i=n;tourShow()}
function tourPlace(){
  if(!tour)return;
  const s=TOUR[tour.i],hole=$("#tourhole"),card=$("#tourcard"),vw=innerWidth,vh=innerHeight;
  const hdr=$(".hdr").getBoundingClientRect(),safeT=Math.max(0,Math.min(hdr.top,60)),safeB=Math.max(0,vh-$("#tabs").getBoundingClientRect().bottom-8);
  let r=null;const el=s.sel&&document.querySelector(s.sel);
  if(el){
    if(!el.closest(".bottom,.hdr")){const b=el.getBoundingClientRect(),free=vh-hdr.bottom,want=b.height>free*.55?hdr.bottom+12:hdr.bottom+Math.max(12,(free-b.height)*.3);
      window.scrollTo({top:Math.max(0,scrollY+b.top-want),behavior:"instant"})}
    const b=el.getBoundingClientRect(),pad=6;
    r={l:Math.max(4,b.left-pad),t:Math.max(4,b.top-pad),r:Math.min(vw-4,b.right+pad),b:Math.min(vh-4,b.bottom+pad)};
  }
  hole.classList.toggle("none",!r);hole.style.borderRadius=el&&el.id==="ring"?"50%":"";
  if(r){hole.style.left=r.l+"px";hole.style.top=r.t+"px";hole.style.width=(r.r-r.l)+"px";hole.style.height=(r.b-r.t)+"px"}
  else{hole.style.left=vw/2+"px";hole.style.top=vh/2+"px";hole.style.width="0px";hole.style.height="0px"}
  const ch=card.offsetHeight,cw=card.offsetWidth,m=12;let top,left;
  if(!r){top=(vh-ch)/2;left=(vw-cw)/2}
  else{const below=r.b+m,above=r.t-m-ch;
    if(below+ch<=vh-m-safeB)top=below;else if(above>=m+safeT)top=above;else top=(r.t+r.b)/2<vh/2?vh-ch-m-safeB:m+safeT;
    left=Math.min(vw-cw-m,Math.max(m,(r.l+r.r)/2-cw/2))}
  card.style.top=Math.round(top)+"px";card.style.left=Math.round(left)+"px";
}
function tourEnd(startDemo){
  if(!tour)return;const t=tour;tour=null;$("#tour").hidden=true;
  st=Object.assign(fresh(),JSON.parse(t.backup));
  if(t.cloud&&t.cloud.upd>st.upd){try{const x=JSON.parse(t.cloud.json);if(x&&x.v===1)st=Object.assign(fresh(),x)}catch(e){}}
  try{localStorage.setItem(TOUR_KEY,"1")}catch(e){}
  lastAlert="";detailSeg="setre";lastHero=null;
  if(startDemo){st.sim={on:true,start:D.plan.call-3,speed:10,base:Date.now()};save()}
  if(view!=="most")location.hash="#most";
  renderAll();window.scrollTo({top:0});
  toast(startDemo?"Próba mód: 10× sebesség. Indítsd el a napot!":"A bemutatót az Info fülön bármikor újranézheted.");
}
addEventListener("resize",()=>tourPlace());
addEventListener("keydown",e=>{if(!tour)return;if(e.key==="Escape")tourEnd(false);else if(e.key==="ArrowRight"||(e.key==="Enter"&&e.target.id==="tourcard"))tourGo(1);else if(e.key==="ArrowLeft")tourGo(-1)});

route(false);
setInterval(()=>tick(false),250);
setTimeout(()=>{let seen=true;try{seen=!!localStorage.getItem(TOUR_KEY)}catch(e){}if(!seen&&!(isShootDay()&&st.cur))tourStart()},600);
</script>
